  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

  <style>
    :root {
      --bg: #1d2022;
      --fg: #f2f2f2;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
      background: var(--bg);
      overflow: hidden;
      color: var(--fg);
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
    }

    /* The hidden defs block holds the single source of truth for the icon. */
    .defs {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .icon {
      width: clamp(140px, 22vmin, 280px);
      aspect-ratio: 171 / 193;
      display: block;
      position: relative;
      z-index: 2;
    }

    @media (max-width: 768px) {
      .icon {
        width: clamp(110px, 30vw, 200px);
      }
    }

    #floaters {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .floater {
      position: absolute;
      aspect-ratio: 171 / 193;
      opacity: 0;
      display: block;
      transform-origin: center center;
      /* Per-element transitions set inline by JS so each floater has its own clock */
    }

    @media (prefers-reduced-motion: reduce) {
      .floater {
        transition: none !important;
      }
    }
  </style>
</head>
<body>

  <!-- Single source of truth for the icon: defined once, referenced by <use> -->
  <svg class="defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <g id="knechtel-icon">
        <path d="M5.17415 63.011C2.96018 62.5816 1.5609 61.2254 1.26671 59.2287C0.893314 56.7122 0.538777 54.2748 0.512376 51.6264L0.101267 12.9028C0.0673216 9.76848 0.346422 6.94681 0.663242 3.8878C0.825424 2.3357 2.21718 0.990788 3.75602 0.753451C7.19201 0.222269 10.2885 0.0452084 13.9546 0.0452085L138.978 7.00523e-06C141.392 7.11075e-06 148.022 0.158232 149.305 1.43533C150.832 2.96107 147.743 8.09583 146.536 10.164L121.179 53.6193C119.539 56.4334 117.434 57.8913 114.307 58.7729L71.8045 70.749C61.0401 73.7816 57.8531 73.2014 46.8474 71.0729L5.17039 63.011L5.17415 63.011Z" fill="#F2F2F2"/>
        <path d="M3.0055 136.265C8.30093 134.118 13.2833 132.773 18.6353 131.247L51.1546 121.991C57.4948 120.187 63.8652 119.704 70.3713 121.113L86.9365 124.707C94.2271 126.29 101.197 128.038 108.36 130.03C116.031 132.159 117.845 135.606 121.394 142.12L141.728 179.423C143.21 182.143 147.411 189.195 145.937 191.263C145.526 191.843 144.228 192.427 143.331 192.45L124.291 193L14.3092 192.977C10.6695 192.977 7.45985 192.721 4.07289 192.329C1.742 192.058 0.550148 190.299 0.429455 188.02C-0.241902 175.46 -0.177786 151.545 0.991432 139.155C1.10081 137.979 1.78349 136.763 3.00174 136.269L3.0055 136.265Z" fill="#F2F2F2"/>

      </g>
    </defs>
  </svg>

  <div id="floaters" aria-hidden="true"></div>

  <svg class="icon" viewBox="0 0 171 193" role="img" aria-label="Gabriel Knechtel">
    <use href="#knechtel-icon"/>
  </svg>

  <script>
    (function () {
      'use strict';

      // ---- Tunables ----
      const COUNT_DESKTOP = 6;
      const COUNT_MOBILE = 3;
      const MOBILE_BREAKPOINT = 768;

      const FADE_IN_MS = 2500;
      const HOLD_MS = 1500;
      const FADE_OUT_MS = 3000;
      const WAIT_MIN_MS = 8000;
      const WAIT_MAX_MS = 20000;

      const OPACITY_MIN = 0.04;
      const OPACITY_MAX = 0.09;

      const SIZE_MIN_RATIO = 0.20;
      const SIZE_MAX_RATIO = 0.80;

      const CENTER_BUFFER = 0.40;   // 40% buffer around the center icon
      const INITIAL_STAGGER_MS = 10000;

      const ICON_W = 171;
      const ICON_H = 193;
      const SVG_NS = 'http://www.w3.org/2000/svg';

      // ---- State ----
      const layer = document.getElementById('floaters');
      const centerIcon = document.querySelector('.icon');
      const prefersReducedMotion =
        window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      const rand = (min, max) => min + Math.random() * (max - min);
      const isMobile = () =>
        window.matchMedia('(max-width: ' + MOBILE_BREAKPOINT + 'px)').matches;

      function getCenterExclusionRect() {
        const r = centerIcon.getBoundingClientRect();
        const bx = r.width * CENTER_BUFFER;
        const by = r.height * CENTER_BUFFER;
        return {
          left: r.left - bx,
          right: r.right + bx,
          top: r.top - by,
          bottom: r.bottom + by
        };
      }

      function overlapsCenter(x, y, w, h) {
        const c = getCenterExclusionRect();
        return !(x + w < c.left || x > c.right || y + h < c.top || y > c.bottom);
      }

      function pickParams() {
        const centerW = centerIcon.getBoundingClientRect().width;
        const ratio = rand(SIZE_MIN_RATIO, SIZE_MAX_RATIO);
        const width = centerW * ratio;
        const height = width * (ICON_H / ICON_W);

        // Try to find a position outside the exclusion zone.
        // Cap attempts so we never block.
        let x = 0, y = 0;
        for (let i = 0; i < 80; i++) {
          x = rand(0, Math.max(0, window.innerWidth - width));
          y = rand(0, Math.max(0, window.innerHeight - height));
          if (!overlapsCenter(x, y, width, height)) break;
        }

        return {
          x: x,
          y: y,
          width: width,
          height: height,
          rotation: Math.random() * 360,
          opacity: rand(OPACITY_MIN, OPACITY_MAX)
        };
      }

      function createFloater() {
        const svg = document.createElementNS(SVG_NS, 'svg');
        svg.setAttribute('viewBox', '0 0 ' + ICON_W + ' ' + ICON_H);
        svg.setAttribute('aria-hidden', 'true');
        svg.classList.add('floater');

        const use = document.createElementNS(SVG_NS, 'use');
        use.setAttribute('href', '#knechtel-icon');
        svg.appendChild(use);

        layer.appendChild(svg);
        return svg;
      }

      function applyPosition(el, p) {
        el.style.left = p.x + 'px';
        el.style.top = p.y + 'px';
        el.style.width = p.width + 'px';
        el.style.height = p.height + 'px';
        el.style.transform = 'rotate(' + p.rotation + 'deg)';
      }

      function cycle(el) {
        const p = pickParams();
        applyPosition(el, p);

        // Set fade-in transition before opacity change
        el.style.transition = 'opacity ' + FADE_IN_MS + 'ms ease-out';
        el.style.opacity = '0';

        // Force reflow so the transition applies to the next opacity change
        void el.offsetWidth;
        el.style.opacity = String(p.opacity);

        // Schedule fade out after fade-in completes + hold
        setTimeout(function () {
          el.style.transition = 'opacity ' + FADE_OUT_MS + 'ms ease-in';
          el.style.opacity = '0';

          // After fade-out completes, wait, then cycle again
          setTimeout(function () {
            const wait = rand(WAIT_MIN_MS, WAIT_MAX_MS);
            setTimeout(function () { cycle(el); }, wait);
          }, FADE_OUT_MS);
        }, FADE_IN_MS + HOLD_MS);
      }

      function placeStatic(el) {
        // Reduced-motion fallback: a single static placement at low opacity.
        const p = pickParams();
        applyPosition(el, p);
        el.style.transition = 'none';
        el.style.opacity = String(p.opacity);
      }

      function init() {
        // Wait until layout has measured the center icon
        if (!centerIcon.getBoundingClientRect().width) {
          requestAnimationFrame(init);
          return;
        }

        const count = isMobile() ? COUNT_MOBILE : COUNT_DESKTOP;

        for (let i = 0; i < count; i++) {
          const el = createFloater();
          if (prefersReducedMotion) {
            placeStatic(el);
          } else {
            // Stagger first appearances so they never sync
            const delay = Math.random() * INITIAL_STAGGER_MS;
            setTimeout(function () { cycle(el); }, delay);
          }
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
